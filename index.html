<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MineMaze 3D: Echoes in the Mist</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #ffffff;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .mc-panel {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(10px);
      border: 3px solid #3c444d;
      box-shadow: inset 0 0 0 2px #161b22, 0 10px 30px rgba(0, 0, 0, 0.65);
      border-radius: 12px;
    }

    .mc-btn {
      background: #3b8526;
      border: 3px solid #255617;
      border-top-color: #5ec440;
      border-left-color: #5ec440;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 0 #1e4612;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.12s ease;
    }

    .mc-btn:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .mc-btn.secondary {
      background: #374151;
      border-color: #1f2937;
      border-top-color: #6b7280;
      border-left-color: #6b7280;
      text-shadow: 0 2px 0 #111827;
    }

    .mc-btn.gold {
      background: #d97706;
      border-color: #92400e;
      border-top-color: #fbbf24;
      border-left-color: #fbbf24;
      text-shadow: 0 2px 0 #78350f;
    }

    /* Minimalist Lobby Overlay */
    #lobby-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 24px;
      background: radial-gradient(circle at center, rgba(13, 17, 23, 0.45) 0%, rgba(13, 17, 23, 0.88) 100%);
      transition: opacity 0.3s ease;
    }

    #lobby-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .coin-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      background: rgba(20, 24, 31, 0.92);
      border: 2px solid #f59e0b;
      border-radius: 999px;
      font-weight: 800;
      font-size: 15px;
      color: #fcd34d;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }

    .potion-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(31, 18, 38, 0.92);
      border: 2px solid #ec4899;
      border-radius: 999px;
      font-weight: 800;
      font-size: 15px;
      color: #f9a8d4;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .potion-badge:active {
      transform: scale(0.93);
    }

    .potion-icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .coin-icon {
      width: 17px;
      height: 17px;
      background: linear-gradient(135deg, #fde047, #d97706);
      border: 2px solid #fef08a;
      border-radius: 4px;
      display: inline-block;
      transform: rotate(12deg);
    }

    .title-block {
      text-align: center;
      margin-top: 4px;
    }

    .game-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 0 #1f2937, 0 0 24px rgba(74, 222, 128, 0.45);
    }

    .lobby-center {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .level-card {
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .level-card.active {
      border-color: #4ade80;
      background: rgba(34, 65, 42, 0.92);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(74, 222, 128, 0.25);
    }

    .level-emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 6px;
    }

    .level-name {
      font-size: 13px;
      font-weight: 800;
      color: #f3f4f6;
    }

    .size-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .size-btn {
      padding: 9px 6px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(30, 36, 44, 0.9);
      border: 2px solid #374151;
      color: #d1d5db;
      border-radius: 8px;
      cursor: pointer;
    }

    .size-btn.active {
      border-color: #60a5fa;
      background: rgba(30, 58, 95, 0.9);
      color: #ffffff;
    }

    .lobby-actions {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .play-btn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      text-transform: uppercase;
    }

    .shop-open-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Skins Modal */
    #shop-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(9, 12, 16, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #shop-modal.open {
      display: flex;
    }

    .shop-box {
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      overflow-y: auto;
      padding-right: 4px;
      max-height: 64vh;
    }

    .skin-card {
      padding: 10px;
      background: rgba(30, 36, 44, 0.94);
      border: 2px solid #374151;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
    }

    .skin-card.equipped {
      border-color: #4ade80;
      background: rgba(26, 56, 34, 0.94);
    }

    .skin-thumb-wrap {
      width: 76px;
      height: 96px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
    }

    .skin-thumb {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .skin-title {
      font-size: 13px;
      font-weight: 800;
      color: #f3f4f6;
    }

    .skin-action-btn {
      width: 100%;
      padding: 7px 8px;
      font-size: 12px;
      border-radius: 7px;
    }

    /* HUD in Game */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    #hud.active {
      display: flex;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hud-btn {
      padding: 7px 11px;
      font-size: 13px;
      border-radius: 8px;
    }

    .radar-pill {
      padding: 6px 11px;
      background: rgba(17, 24, 39, 0.85);
      border: 2px solid #374151;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .radar-bar-wrap {
      width: 52px;
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }

    .radar-bar-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #3b82f6, #4ade80, #facc15);
      transition: width 0.2s ease;
    }

    /* Potion Toast Notification */
    #potion-toast {
      align-self: center;
      background: rgba(131, 24, 67, 0.92);
      border: 2px solid #f472b6;
      color: #fce7f3;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      text-align: center;
    }

    #potion-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Controls */
    .controls-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      padding-bottom: 6px;
    }

    .dpad {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
      gap: 6px;
    }

    .dpad-btn {
      background: rgba(31, 41, 55, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(74, 222, 128, 0.55);
      border-color: #4ade80;
      transform: scale(0.94);
    }

    .right-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .cam-btn {
      padding: 11px 13px;
      font-size: 13px;
    }

    /* Win Modal */
    #win-modal {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(9, 12, 16, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #win-modal.open {
      display: flex;
    }

    .win-box {
      width: 100%;
      max-width: 360px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .win-title {
      font-size: 26px;
      font-weight: 900;
      color: #4ade80;
    }

    .win-stats {
      font-size: 16px;
      color: #e5e7eb;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- Minimalist Lobby -->
  <div id="lobby-screen">
    <div class="top-bar">
      <div class="coin-badge">
        <span class="coin-icon"></span>
        <span id="lobby-coins">0</span>
      </div>
      <div class="potion-badge">
        <img class="potion-icon-img" id="lobby-potion-img" alt="Зелье" />
        <span id="lobby-potions">0</span>
      </div>
      <div class="coin-badge" style="border-color: #4ade80; color: #86efac;">
        <span id="player-greeting">Игрок</span>
      </div>
    </div>

    <div class="title-block">
      <div class="game-title">MineMaze 3D</div>
    </div>

    <div class="lobby-center">
      <div class="levels-grid" id="level-cards">
        <div class="mc-panel level-card active" data-level="0">
          <span class="level-emoji">🏛️</span>
          <span class="level-name">Руины</span>
        </div>
        <div class="mc-panel level-card" data-level="1">
          <span class="level-emoji">🎄</span>
          <span class="level-name">Зима</span>
        </div>
        <div class="mc-panel level-card" data-level="2">
          <span class="level-emoji">🌴</span>
          <span class="level-name">Джунгли</span>
        </div>
      </div>

      <div class="size-selector" id="size-buttons">
        <button class="size-btn active" data-size="25">25 × 25</button>
        <button class="size-btn" data-size="35">35 × 35</button>
        <button class="size-btn" data-size="45">45 × 45</button>
      </div>
    </div>

    <div class="lobby-actions">
      <button class="mc-btn play-btn" id="btn-start">ИГРАТЬ</button>
      <button class="mc-btn secondary shop-open-btn" id="btn-open-shop">
        <span>👕 МАГАЗИН СКИНОВ</span>
      </button>
    </div>
  </div>

  <!-- Skins Shop Modal -->
  <div id="shop-modal">
    <div class="mc-panel shop-box">
      <div class="shop-header">
        <h3 style="font-size: 18px; font-weight: 800;">Магазин скинов</h3>
        <div class="coin-badge" style="padding: 4px 10px; font-size: 14px;">
          <span class="coin-icon"></span>
          <span id="shop-coins">0</span>
        </div>
      </div>
      <div class="skins-grid" id="skins-grid"></div>
      <button class="mc-btn secondary" style="padding: 11px;" id="btn-close-shop">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="hud">
    <div class="hud-top">
      <button class="mc-btn secondary hud-btn" id="btn-back-lobby">⬅ Лобби</button>
      <div class="radar-pill">
        <span>🎵</span>
        <div class="radar-bar-wrap">
          <div class="radar-bar-fill" id="radar-fill"></div>
        </div>
      </div>
      <div class="potion-badge" id="hud-potion-btn" title="Нажми ◀ + ▶ дважды, чтобы сломать стену">
        <img class="potion-icon-img" id="hud-potion-img" alt="Зелье" />
        <span id="hud-potions">0</span>
      </div>
      <div class="coin-badge" style="padding: 5px 11px; font-size: 14px;">
        <span class="coin-icon"></span>
        <span id="hud-coins">0</span>
      </div>
    </div>

    <div id="potion-toast">🧪 Нажми ◀ + ▶ ещё раз, чтобы сломать стену!</div>

    <div class="controls-wrap">
      <div class="dpad">
        <div></div>
        <button class="dpad-btn" data-dir="up">▲</button>
        <div></div>
        <button class="dpad-btn" data-dir="left">◀</button>
        <div></div>
        <button class="dpad-btn" data-dir="right">▶</button>
        <div></div>
        <button class="dpad-btn" data-dir="down">▼</button>
        <div></div>
      </div>
      <div class="right-controls">
        <button class="mc-btn secondary cam-btn" id="btn-toggle-cam">🎥 Камера</button>
      </div>
    </div>
  </div>

  <!-- Win Modal -->
  <div id="win-modal">
    <div class="mc-panel win-box">
      <div class="win-title">УРОВЕНЬ ПРОЙДЕН!</div>
      <div class="win-stats" id="win-stats"></div>
      <button class="mc-btn" style="padding: 14px; font-size: 16px;" id="btn-next-level">СЛЕДУЮЩИЙ МИР ➔</button>
      <button class="mc-btn secondary" style="padding: 11px; font-size: 14px;" id="btn-win-lobby">В ЛОББИ</button>
    </div>
  </div>

    // =========================================================
    // 3. АУДИО-СИСТЕМА (Динамическая громкость + Low-Pass радар)
    // =========================================================
    let audioCtx = null;
    let bgAudio = new Audio();
    bgAudio.loop = true;
    bgAudio.crossOrigin = 'anonymous';
    let sourceNode = null;
    let filterNode = null;
    let gainNode = null;
    let audioGraphReady = false;

    function initAudioGraph() {
      if (audioGraphReady) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        sourceNode = audioCtx.createMediaElementSource(bgAudio);
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 350;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.25;

        sourceNode.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        audioGraphReady = true;
      } catch (e) {
        console.warn('WebAudio fallback to standard volume', e);
      }
    }

    function playLevelMusic(levelIdx) {
      initAudioGraph();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const src = LEVEL_AUDIO_CONFIG[levelIdx] || LEVEL_AUDIO_CONFIG[0];
      if (!bgAudio.src.endsWith(src.replace('./', ''))) {
        bgAudio.src = src;
      }
      bgAudio.volume = 1.0;
      bgAudio.play().catch(() => {});
    }

    function stopLevelMusic() {
      bgAudio.pause();
    }

    function updateAudioRadar(proximity0to1) {
      const eased = Math.pow(proximity0to1, 1.35);
      const vol = 0.16 + eased * 0.84;
      const freq = 320 + eased * 15500;

      if (audioGraphReady && gainNode && filterNode && audioCtx) {
        gainNode.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.08);
        filterNode.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
      } else {
        bgAudio.volume = Math.max(0.1, Math.min(1, vol));
      }

      const pct = Math.round(12 + eased * 88);
      document.getElementById('radar-fill').style.width = pct + '%';
    }

    function playCoinSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.07);
      g.gain.setValueAtTime(0.2, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.27);
    }

    function playPotionPickupSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const freqs = [523.25, 659.25, 783.99, 1046.5];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.045);
        g.gain.setValueAtTime(0.18, now + idx * 0.045);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.22);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now + idx * 0.045);
        osc.stop(now + idx * 0.045 + 0.23);
      });
    }

    function playWallBreakSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.35);
      g.gain.setValueAtTime(0.32, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.37);
    }

    // =========================================================
    // 4. ПРОЦЕДУРНЫЕ ТЕКСТУРЫ БЛОКОВ И ПЕРСОНАЖЕЙ
    // =========================================================
    function createBlockTexture(baseHex, noiseHex1, noiseHex2, pattern = 'noise') {
      const c = document.createElement('canvas');
      c.width = 16;
      c.height = 16;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 16, 16);

      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          const r = Math.random();
          if (pattern === 'bricks') {
            if (y % 4 === 0 || (x + (Math.floor(y / 4) % 2) * 4) % 8 === 0) {
              ctx.fillStyle = noiseHex1;
              ctx.fillRect(x, y, 1, 1);
            } else if (r < 0.25) {
              ctx.fillStyle = noiseHex2;
              ctx.fillRect(x, y, 1, 1);
            }
          } else if (pattern === 'wood') {
            if (x % 3 === 0 && r < 0.7) {
              ctx.fillStyle = noiseHex1;
              ctx.fillRect(x, y, 1, 1);
            } else if (r < 0.2) {
              ctx.fillStyle = noiseHex2;
              ctx.fillRect(x, y, 1, 1);
            }
          } else {
            if (r < 0.28) {
              ctx.fillStyle = noiseHex1;
              ctx.fillRect(x, y, 1, 1);
            } else if (r > 0.78) {
              ctx.fillStyle = noiseHex2;
              ctx.fillRect(x, y, 1, 1);
            }
          }
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    // Генерация большого лабиринта (Итеративный алгоритм без переполнения стека)
    function generateMaze(size) {
      const grid = Array.from({ length: size }, () => Array(size).fill(1));
      const stack = [[1, 1]];
      grid[1][1] = 0;

      while (stack.length > 0) {
        const [cx, cz] = stack[stack.length - 1];
        const dirs = [
          [0, -2], [2, 0], [0, 2], [-2, 0]
        ].sort(() => Math.random() - 0.5);

        let moved = false;
        for (const [dx, dz] of dirs) {
          const nx = cx + dx;
          const nz = cz + dz;
          if (nx > 0 && nx < size - 1 && nz > 0 && nz < size - 1 && grid[nz][nx] === 1) {
            grid[cz + dz / 2][cx + dx / 2] = 0;
            grid[nz][nx] = 0;
            stack.push([nx, nz]);
            moved = true;
            break;
          }
        }
        if (!moved) stack.pop();
      }

      // Добавим немного развилок (около 6%), чтобы в огромном лабиринте было интереснее ориентироваться
      for (let z = 2; z < size - 2; z++) {
        for (let x = 2; x < size - 2; x++) {
          if (grid[z][x] === 1 && Math.random() < 0.06) {
            const horiz = grid[z][x - 1] === 0 && grid[z][x + 1] === 0;
            const vert = grid[z - 1][x] === 0 && grid[z + 1][x] === 0;
            if (horiz || vert) grid[z][x] = 0;
          }
        }
      }

      grid[size - 2][size - 2] = 0;
      return grid;
    }

    function computeDistances(grid, ex, ez) {
      const size = grid.length;
      const dist = Array.from({ length: size }, () => Array(size).fill(9999));
      const queue = [[ex, ez, 0]];
      dist[ez][ex] = 0;
      let head = 0;
      let maxD = 1;

      while (head < queue.length) {
        const [x, z, d] = queue[head++];
        if (d > maxD) maxD = d;
        for (const [dx, dz] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
          const nx = x + dx;
          const nz = z + dz;
          if (nx >= 0 && nx < size && nz >= 0 && nz < size && grid[nz][nx] === 0 && dist[nz][nx] > d + 1) {
            dist[nz][nx] = d + 1;
            queue.push([nx, nz, d + 1]);
          }
        }
      }
      return { dist, maxD };
    }

    function spawnParticleBurst(wx, wz, color1 = 0xfacc15, color2 = 0xfef08a, count = 14) {

            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, 0.725, z);
            worldGroup.add(wall);
            cellMeshes.push(wall);

            if (levelIdx === 0 && (x + z) % 5 === 0) {
              const rune = new THREE.Mesh(new THREE.BoxGeometry(1.03, 0.22, 0.22), runeMat);
              rune.position.set(x, 0.85, z);
              worldGroup.add(rune);
              cellMeshes.push(rune);
            } else if (levelIdx === 1 && (x === 0 || x === size - 1 || z === 0 || z === size - 1 || (x + z) % 3 === 0)) {
              const bulbColor = bulbColors[(x + z) % bulbColors.length];
              const bulbMat = new THREE.MeshBasicMaterial({ color: bulbColor });
              const bulb = new THREE.Mesh(new THREE.BoxGeometry(1.06, 0.14, 0.14), bulbMat);
              bulb.position.set(x, 1.15, z);
              worldGroup.add(bulb);
              garlandBulbs.push(bulb);
              cellMeshes.push(bulb);
            } else if (levelIdx === 2 && (x + z) % 2 === 0) {
              const vine = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.9, 0.15), vineMat);
              vine.position.set(x, 0.95, z);
              worldGroup.add(vine);
              cellMeshes.push(vine);
              if ((x * z) % 3 === 0) {
                const fl = new THREE.Mesh(new THREE.BoxGeometry(1.08, 0.14, 0.14), flowerMat);
                fl.position.set(x, 0.7, z);
                worldGroup.add(fl);
                cellMeshes.push(fl);
              }
            }
            wallMeshMap[`${x},${z}`] = cellMeshes;
          } else {
            const isStart = (x === 1 && z === 1);
            const isExit = (x === exitPos.x && z === exitPos.z);
            if (!isStart && !isExit) {
              const rand = Math.random();
              if (rand < 0.045) {
                // Розовое зелье для разрушения стен
                const potionGroup = new THREE.Group();
                const spriteMat = new THREE.SpriteMaterial({ map: potionTexture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(0.55, 0.55, 1);
                sprite.position.y = 0.5;

                const ring = new THREE.Mesh(
                  new THREE.BoxGeometry(0.36, 0.04, 0.36),
                  new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.75 })
                );
                ring.position.y = 0.03;
                potionGroup.add(sprite, ring);
                potionGroup.position.set(x, 0, z);
                potionGroup.userData = { gx: x, gz: z, phase: Math.random() * Math.PI * 2 };
                worldGroup.add(potionGroup);
                potionMeshes.push(potionGroup);
              } else if (levelIdx === 1 && rand < 0.10) {
                const giftGroup = new THREE.Group();
                const boxColor = [0xdc2626, 0x2563eb, 0x16a34a][(x + z) % 3];
                const box = new THREE.Mesh(
                  new THREE.BoxGeometry(0.42, 0.42, 0.42),
                  new THREE.MeshLambertMaterial({ color: boxColor })
                );
                box.position.y = 0.21;
                const ribbon = new THREE.Mesh(
                  new THREE.BoxGeometry(0.45, 0.45, 0.1),
                  new THREE.MeshBasicMaterial({ color: 0xfacc15 })
                );
                ribbon.position.y = 0.21;
                giftGroup.add(box, ribbon);
                giftGroup.position.set(x, 0, z);
                worldGroup.add(giftGroup);
              } else if (rand < 0.22) {
                const coin = new THREE.Mesh(
                  new THREE.BoxGeometry(0.32, 0.32, 0.1),
                  new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0x854d0e })
                );
                coin.position.set(x, 0.45, z);
                coin.userData = { gx: x, gz: z, phase: Math.random() * Math.PI * 2 };
                worldGroup.add(coin);
                coinMeshes.push(coin);
              }
            }
          }
        }
      }

      // Exit Beacon Portal
      const beaconGroup = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.75, 0.16, 0.75),
        new THREE.MeshLambertMaterial({ color: 0x38bdf8 })
      );
      base.position.y = 0.08;
      const beam = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 7.0, 0.34),
        new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.65 })
      );
      beam.position.y = 3.5;
      beaconGroup.add(base, beam);
      beaconGroup.position.set(exitPos.x, 0, exitPos.z);
      worldGroup.add(beaconGroup);
      exitBeacon = beaconGroup;

      if (levelIdx === 1 || levelIdx === 2) {
        const count = 260;
        const pGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          positions[i * 3] = Math.random() * size;
          positions[i * 3 + 1] = 0.3 + Math.random() * 3.8;
          positions[i * 3 + 2] = Math.random() * size;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const pMat = new THREE.PointsMaterial({
          color: levelIdx === 1 ? 0xffffff : 0xa3e635,
          size: levelIdx === 1 ? 0.13 : 0.15
        });
        weatherParticles = new THREE.Points(pGeo, pMat);
        worldGroup.add(weatherParticles);
      }

      buildPlayerMesh();
      playerMesh.position.set(playerPos.x, 0, playerPos.z);
      updateFogAndMusic();
    }

    function updateFogAndMusic() {
      const gx = Math.max(0, Math.min(mazeSize - 1, Math.round(playerPos.x)));
      const gz = Math.max(0, Math.min(mazeSize - 1, Math.round(playerPos.z)));
      const d = (distGrid[gz] && distGrid[gz][gx] !== undefined) ? distGrid[gz][gx] : maxDist;
      const proximity = Math.max(0, Math.min(1, 1 - d / maxDist));

      const targetDensity = 0.18 - proximity * 0.145;
      scene.fog.density += (targetDensity - scene.fog.density) * 0.12;

      updateAudioRadar(proximity);
    }

    // =========================================================
    // 6. МЕХАНИКА ЗЕЛЬЯ: ДВОЙНОЕ НАЖАТИЕ ◀ + ▶ ЛОМАЕТ СТЕНУ СПЕРЕДИ
    // =========================================================
    let toastTimer = null;
    function showPotionToast(msg) {
      const el = document.getElementById('potion-toast');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 1700);
    }

    let leftLastDownTime = 0;
    let rightLastDownTime = 0;
    let lrComboCount = 0;
    let lastComboSuccessTime = 0;

    function registerLRPress(side) {
      if (!isPlaying) return;
      const now = performance.now();
      if (side === 'left') leftLastDownTime = now;
      if (side === 'right') rightLastDownTime = now;

      // Если левая и правая стрелки нажаты одновременно (разница <= 320 мс)
      if (Math.abs(leftLastDownTime - rightLastDownTime) <= 320) {
        // Сбрасываем таймстемпы, чтобы одно одновременное нажатие засчиталось 1 раз
        leftLastDownTime = 0;
        rightLastDownTime = 0;

        if (now - lastComboSuccessTime > 2200) {
          lrComboCount = 0;
        }
        lrComboCount += 1;
        lastComboSuccessTime = now;

        if (lrComboCount === 1) {
          haptic('light');
          showPotionToast('🧪 Зелье (1/2): нажми ◀ + ▶ ещё раз!');
        } else if (lrComboCount >= 2) {
          lrComboCount = 0;
          usePotionBreakWall();
        }
      }
    }

    function usePotionBreakWall() {
      if (!isPlaying) return;
      if (saveData.potions <= 0) {
        showPotionToast('🧪 Нет зелий! Найди розовое зелье в лабиринте');
        haptic('heavy');
        return;
      }

      let dx = 0, dz = 0;
      if (facingDir === 'up') dz = -1;
      else if (facingDir === 'down') dz = 1;
      else if (facingDir === 'left') dx = -1;
      else if (facingDir === 'right') dx = 1;

      const gx = Math.round(playerPos.x);
      const gz = Math.round(playerPos.z);
      const wx = gx + dx;
      const wz = gz + dz;

      // Проверяем, что перед игроком внутренняя стена (не внешняя граница карты)
      if (wx <= 0 || wx >= mazeSize - 1 || wz <= 0 || wz >= mazeSize - 1) {
        showPotionToast('🧱 Внешнюю границу мира сломать нельзя!');
        haptic('heavy');
        return;
      }

      if (mazeGrid[wz][wx] !== 1) {
        showPotionToast('💨 Впереди нет стены — повернись к стене!');
        haptic('light');
        return;
      }

      // Ломаем стену!
      saveData.potions -= 1;
      saveProgress();

      mazeGrid[wz][wx] = 0;
      const key = `${wx},${wz}`;
      if (wallMeshMap[key]) {
        wallMeshMap[key].forEach(m => worldGroup.remove(m));
        delete wallMeshMap[key];
      }

      spawnParticleBurst(wx, wz, 0xf472b6, 0x9ca3af, 22);
      playWallBreakSound();
      haptic('success');
      showPotionToast('💥 Стена разрушена зельем!');

      // Пересчитываем кратчайший путь до выхода
      const { dist, maxD } = computeDistances(mazeGrid, exitPos.x, exitPos.z);
      distGrid = dist;
      maxDist = maxD;
    }

    // Двойной клик по иконке зелья в HUD также активирует зелье (для удобства на телефонах)
    let hudPotionTapTime = 0;
    document.getElementById('hud-potion-btn').addEventListener('click', () => {
      const now = performance.now();
      if (now - hudPotionTapTime < 900) {
        hudPotionTapTime = 0;
        usePotionBreakWall();
      } else {
        hudPotionTapTime = now;
        showPotionToast('🧪 Нажми ещё раз (или ◀ + ▶ дважды), чтобы сломать стену!');
      }
    });

    // =========================================================
    // 7. ПЛАВНОЕ НЕПРЕРЫВНОЕ ДВИЖЕНИЕ БЕЗ ПРЫЖКОВ
    // =========================================================
    const activeDirs = new Set();
    let swipeDir = null;
    let swipeTimeout = null;

    function setDirectionActive(dir, isDown) {
      if (isDown) {
        activeDirs.add(dir);
        if (dir === 'left' || dir === 'right') {
          registerLRPress(dir);
        }
      } else {
        activeDirs.delete(dir);
      }
    }

    function canWalkAt(x, z) {
      const r = 0.27; // Радиус коллизии игрока
      const points = [
        [x - r, z - r],
        [x + r, z - r],
        [x - r, z + r],
        [x + r, z + r]
      ];
      for (const [px, pz] of points) {
        const gx = Math.round(px);
        const gz = Math.round(pz);
        if (gx < 0 || gx >= mazeSize || gz < 0 || gz >= mazeSize) return false;
        if (mazeGrid[gz][gx] === 1) return false;
      }
      return true;
    }

    function updateSmoothPlayerMovement(dt) {
      // Определяем текущее направление
      let dir = null;
      const dirsArray = Array.from(activeDirs);
      if (dirsArray.length > 0) {
        dir = dirsArray[dirsArray.length - 1];
      } else if (swipeDir) {
        dir = swipeDir;
      }

      if (dir) {
        facingDir = dir;
        let vx = 0, vz = 0;
        if (dir === 'up') { vz = -1; targetRotationY = Math.PI; }
        else if (dir === 'down') { vz = 1; targetRotationY = 0; }
        else if (dir === 'left') { vx = -1; targetRotationY = -Math.PI / 2; }
        else if (dir === 'right') { vx = 1; targetRotationY = Math.PI / 2; }

        const speed = 4.3; // Плавная скорость скольжения
        const step = speed * dt;

        // Пробуем шагнуть по основной оси + мягко центрируем игрока в коридоре, чтобы легко входить в повороты
        if (vx !== 0) {
          const nextX = playerPos.x + vx * step;
          if (canWalkAt(nextX, playerPos.z)) {
            playerPos.x = nextX;
          } else {
            // Если уперлись углом в поворот, плавно доводим по Z к центру прохода
            const snapZ = Math.round(playerPos.z);
            if (canWalkAt(nextX, snapZ)) {
              playerPos.z += (snapZ - playerPos.z) * Math.min(1, dt * 14);
              if (canWalkAt(nextX, playerPos.z)) playerPos.x = nextX;
            }
          }
          // Мягкое выравнивание по центру коридора Z
          const centerZ = Math.round(playerPos.z);
          if (Math.abs(centerZ - playerPos.z) < 0.35 && canWalkAt(playerPos.x, centerZ)) {
            playerPos.z += (centerZ - playerPos.z) * Math.min(1, dt * 10);
          }
        }

        if (vz !== 0) {
          const nextZ = playerPos.z + vz * step;
          if (canWalkAt(playerPos.x, nextZ)) {
            playerPos.z = nextZ;
          } else {
            const snapX = Math.round(playerPos.x);
            if (canWalkAt(snapX, nextZ)) {
              playerPos.x += (snapX - playerPos.x) * Math.min(1, dt * 14);
              if (canWalkAt(playerPos.x, nextZ)) playerPos.z = nextZ;
            }
          }
          const centerX = Math.round(playerPos.x);
          if (Math.abs(centerX - playerPos.x) < 0.35 && canWalkAt(centerX, playerPos.z)) {
            playerPos.x += (centerX - playerPos.x) * Math.min(1, dt * 10);
          }
        }

        // Плавное качание рук и ног как в Minecraft (БЕЗ прыжков по Y!)
        walkCycle += dt * 11;
        const swing = Math.sin(walkCycle) * 0.55;
        if (playerLimbs.leftLeg) {
          playerLimbs.leftLeg.rotation.x = swing;
          playerLimbs.rightLeg.rotation.x = -swing;
          playerLimbs.leftArm.rotation.x = -swing * 0.85;
          playerLimbs.rightArm.rotation.x = swing * 0.85;
        }
      } else {
        // Плавно возвращаем руки и ноги в покой
        if (playerLimbs.leftLeg) {
          playerLimbs.leftLeg.rotation.x *= 0.82;
          playerLimbs.rightLeg.rotation.x *= 0.82;
          playerLimbs.leftArm.rotation.x *= 0.82;
          playerLimbs.rightArm.rotation.x *= 0.82;
        }
      }

      // Никаких прыжков по Y: позиция Y всегда ровно 0
      playerMesh.position.set(playerPos.x, 0, playerPos.z);

      // Плавный поворот персонажа
      let diff = targetRotationY - playerMesh.rotation.y;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      playerMesh.rotation.y += diff * Math.min(1, dt * 16);

      checkCellPickups();
    }

    function checkCellPickups() {
      // Сбор монет по расстоянию
      for (let i = coinMeshes.length - 1; i >= 0; i--) {
        const c = coinMeshes[i];
        if (Math.hypot(playerPos.x - c.userData.gx, playerPos.z - c.userData.gz) < 0.55) {
          spawnParticleBurst(c.userData.gx, c.userData.gz, 0xfacc15, 0xfef08a, 14);
          worldGroup.remove(c);
          coinMeshes.splice(i, 1);

          sessionCoins += 1;
          saveData.coins += 1;
          saveProgress();
          playCoinSound();
          haptic('medium');
        }
      }

      // Сбор розовых зелий
      for (let i = potionMeshes.length - 1; i >= 0; i--) {
        const p = potionMeshes[i];
        if (Math.hypot(playerPos.x - p.userData.gx, playerPos.z - p.userData.gz) < 0.55) {
          spawnParticleBurst(p.userData.gx, p.userData.gz, 0xf472b6, 0x38bdf8, 16);
          worldGroup.remove(p);
          potionMeshes.splice(i, 1);

          saveData.potions += 1;
          saveProgress();
          playPotionPickupSound();
          haptic('success');
          showPotionToast('🧪 +1 Зелье! Нажми ◀ + ▶ дважды у стены, чтобы сломать её');
        }
      }

      // Проверка выхода
      if (Math.hypot(playerPos.x - exitPos.x, playerPos.z - exitPos.z) < 0.55) {
        onLevelComplete();
      }
    }

    function onLevelComplete() {
      isPlaying = false;
      activeDirs.clear();
      swipeDir = null;
      haptic('success');
      if (!saveData.completedLevels.includes(currentLevel)) {
        saveData.completedLevels.push(currentLevel);
        saveProgress();
      }
      document.getElementById('win-stats').innerHTML =
        `Собрано монет за забег: <b>+${sessionCoins} 🪙</b><br>Всего в банке: <b>${saveData.coins} 🪙</b><br>Зелий в запасе: <b>${saveData.potions} 🧪</b>`;
      document.getElementById('win-modal').classList.add('open');
    }

    // Экранные кнопки D-Pad (мультитач для одновременного нажатия ◀ + ▶)
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const startHold = (e) => {
        e.preventDefault();
        btn.classList.add('pressed');
        setDirectionActive(dir, true);
      };
      const endHold = (e) => {
        e.preventDefault();
        btn.classList.remove('pressed');
        setDirectionActive(dir, false);
      };
      btn.addEventListener('touchstart', startHold, { passive: false });
      btn.addEventListener('touchend', endHold, { passive: false });
      btn.addEventListener('touchcancel', endHold, { passive: false });
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('mouseup', endHold);
      btn.addEventListener('mouseleave', endHold);
    });

    // Клавиатура
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirectionActive('up', true);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirectionActive('down', true);
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirectionActive('left', true);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirectionActive('right', true);
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirectionActive('up', false);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirectionActive('down', false);
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirectionActive('left', false);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirectionActive('right', false);
    });

    // Свайпы по экрану
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (!isPlaying || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (Math.hypot(dx, dy) > 22) {
        if (Math.abs(dx) > Math.abs(dy)) swipeDir = dx > 0 ? 'right' : 'left';
        else swipeDir = dy > 0 ? 'down' : 'up';
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        if (swipeTimeout) clearTimeout(swipeTimeout);
        swipeTimeout = setTimeout(() => { swipeDir = null; }, 320);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      swipeDir = null;
    }, { passive: true });

    // =========================================================
    // 8. МАГАЗИН СКИНОВ С ОРИГИНАЛЬНЫМИ ФОТО И ЦЕНАМИ
    // =========================================================
    function renderSkinsShop() {
      const grid = document.getElementById('skins-grid');
      grid.innerHTML = '';
      SKINS_CATALOG.forEach(skin => {
        const unlocked = saveData.unlockedSkins.includes(skin.id);
        const equipped = saveData.equippedSkin === skin.id;

        const card = document.createElement('div');
        card.className = 'skin-card' + (equipped ? ' equipped' : '');

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'skin-thumb-wrap';
        const img = document.createElement('img');
        img.className = 'skin-thumb';
        img.src = SKIN_IMAGES[skin.id] || '';
        img.alt = skin.name;
        thumbWrap.appendChild(img);

        const title = document.createElement('div');
        title.className = 'skin-title';
        title.textContent = skin.name;

        const btn = document.createElement('button');
        btn.className = 'mc-btn skin-action-btn ' + (equipped ? '' : unlocked ? 'secondary' : 'gold');

        if (equipped) {
          btn.textContent = 'ВЫБРАН ✓';
        } else if (unlocked) {
          btn.textContent = 'НАДЕТЬ';
          btn.onclick = () => {
            saveData.equippedSkin = skin.id;
            saveProgress();
            buildPlayerMesh();
            renderSkinsShop();
            haptic('light');
          };
        } else {
          btn.textContent = `КУПИТЬ (${skin.price} 🪙)`;
          btn.onclick = () => {
            if (saveData.coins >= skin.price) {
              saveData.coins -= skin.price;
              saveData.unlockedSkins.push(skin.id);
              saveData.equippedSkin = skin.id;
              saveProgress();
              buildPlayerMesh();
              renderSkinsShop();
              playCoinSound();
              haptic('success');
            } else {
              haptic('heavy');
            }
          };
        }

        card.append(thumbWrap, title, btn);
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.level-card').forEach(card => {
      card.onclick = () => {
        document.querySelectorAll('.level-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentLevel = parseInt(card.dataset.level, 10);
        haptic('light');
      };
    });

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mazeSize = parseInt(btn.dataset.size, 10);
        haptic('light');
      };
    });

    function startGame() {
      sessionCoins = 0;
      activeDirs.clear();
      swipeDir = null;
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('win-modal').classList.remove('open');
      document.getElementById('hud').classList.add('active');
      buildWorld(currentLevel, mazeSize);
      playLevelMusic(currentLevel);
      isPlaying = true;
    }

    function returnToLobby() {
      isPlaying = false;
      activeDirs.clear();
      swipeDir = null;
      stopLevelMusic();
      document.getElementById('hud').classList.remove('active');
      document.getElementById('win-modal').classList.remove('open');
      document.getElementById('lobby-screen').classList.remove('hidden');
      updateResourceUI();
    }

    document.getElementById('btn-start').onclick = startGame;
    document.getElementById('btn-back-lobby').onclick = returnToLobby;
    document.getElementById('btn-win-lobby').onclick = returnToLobby;

    document.getElementById('btn-next-level').onclick = () => {
      currentLevel = (currentLevel + 1) % 3;
      document.querySelectorAll('.level-card').forEach(c => {
        c.classList.toggle('active', parseInt(c.dataset.level, 10) === currentLevel);
      });
      startGame();
    };

    document.getElementById('btn-open-shop').onclick = () => {
      renderSkinsShop();
      document.getElementById('shop-modal').classList.add('open');
    };
    document.getElementById('btn-close-shop').onclick = () => {
      document.getElementById('shop-modal').classList.remove('open');
    };

    document.getElementById('btn-toggle-cam').onclick = () => {
      camModeClose = !camModeClose;
      haptic('light');
    };

    // =========================================================
    // 9. ГЛАВНЫЙ ЦИКЛ РЕНДЕРА (60 FPS)
    // =========================================================
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.08);
      lastTime = now;

      if (isPlaying) {
        updateSmoothPlayerMovement(dt);

        playerLight.position.set(playerMesh.position.x, 2.0, playerMesh.position.z);

        const camY = camModeClose ? 4.4 : 8.2;
        const camZOffset = camModeClose ? 3.8 : 6.4;
        camera.position.x += (playerMesh.position.x - camera.position.x) * Math.min(1, dt * 10);
        camera.position.y += (camY - camera.position.y) * Math.min(1, dt * 10);
        camera.position.z += (playerMesh.position.z + camZOffset - camera.position.z) * Math.min(1, dt * 10);
        camera.lookAt(playerMesh.position.x, 0.5, playerMesh.position.z - 0.35);

        updateFogAndMusic();
      } else {
        const t = now * 0.0002;
        const center = mazeSize / 2;
        camera.position.set(center + Math.cos(t) * 11, 11.5, center + Math.sin(t) * 11);
        camera.lookAt(center, 0, center);
      }

      // Вращение монет
      coinMeshes.forEach(c => {
        c.rotation.y += dt * 3.2;
        c.position.y = 0.45 + Math.sin(now * 0.005 + c.userData.phase) * 0.07;
      });

      // Парение розовых зелий
      potionMeshes.forEach(p => {
        p.position.y = Math.sin(now * 0.004 + p.userData.phase) * 0.08;
      });

      // Частицы взрыва стен, монет и зелий
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.userData.life -= dt;
        if (p.userData.life <= 0) {
          worldGroup.remove(p);
          burstParticles.splice(i, 1);
        } else {
          p.position.x += p.userData.vx * dt;
          p.position.y += p.userData.vy * dt;
          p.position.z += p.userData.vz * dt;
          p.userData.vy -= 9.8 * dt;
          p.scale.setScalar(Math.max(0.01, p.userData.life * 1.8));
        }
      }

      if (garlandBulbs.length > 0) {
        const pulse = 0.75 + Math.sin(now * 0.006) * 0.25;
        garlandBulbs.forEach((b, idx) => {
          b.scale.setScalar(idx % 2 === 0 ? pulse : 1.5 - pulse);
        });
      }

      if (weatherParticles) {
        const pos = weatherParticles.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          if (currentLevel === 1) {
            pos[i + 1] -= dt * 1.1;
            if (pos[i + 1] < 0) pos[i + 1] = 3.8;
          } else {
            pos[i + 1] += Math.sin(now * 0.003 + i) * dt * 0.35;
          }
        }
        weatherParticles.geometry.attributes.position.needsUpdate = true;
      }

      if (exitBeacon) {
        exitBeacon.rotation.y += dt * 1.5;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Boot
    loadProgress();
    buildWorld(0, 25);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
